        function CreditRequest(data) {

        function BackgroundCheck() {
            this.check = function(creditRequest, amount) {

        function RiskCheck() {

        function BIKCheck() {
            this.check = function(creditRequest, amount) {
                return true;
            }
        }

        CreditRequest.prototype.applyFor = function(creditRequest, amount) {
            let result = {
                result: false,
                error: null
            };

            let riskCheck = new RiskCheck();
            let backgroundCheck = new BackgroundCheck();
            let bikCheck = new BIKCheck();

            if (!riskCheck.check(creditRequest, amount)) {
                result.result = false;
                result.error = "Not approved by Risk Department";
            }

            if (!backgroundCheck.check(creditRequest, amount)) {
                result.result = false;
                result.error = "Not approved by Back. Department";
            }

            if (!bikCheck.check(creditRequest, amount)) {
                result.result = false;
                result.error = "Not approved by BIK";
            }

            if (!result.error) {
                result.result = true;
            }

            return result;
        }

        //fly weight

        function Flyweight(brand, cpu, ram) {
            this.brand = brand;
            this.cpu = cpu;
            this.ram = ram;
        }

        function Computer(brand, cpu, ram, color, modelId) {
            this.flyweight = FlyweightFactory.get(brand, cpu, ram);
            this.color = color;
            this.modelId = modelId;
        }

        const FlyweightFactory = (function() {
            let flyweights = {};

            return {
                get: function(brand, cpu, ram) {
                    let propName = `${brand}_${cpu}_${ram}`;
                    if(!flyweights[propName]) {
                        flyweights[propName] = new Flyweight(brand, cpu, ram);
                    }

                    return flyweights[propName];
                },

                count: function() {
                    return Object.keys(flyweights).length;
                }
            }
        })();
